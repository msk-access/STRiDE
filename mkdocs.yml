site_name: STRiDE
site_description: MSI prediction pipeline for MSK-ACCESS
site_author: MSK-ACCESS
site_url: https://msk-access.github.io/STRiDE/
repo_url: https://github.com/msk-access/STRiDE
repo_name: msk-access/STRiDE
copyright: Copyright &copy; 2026 Memorial Sloan Kettering Cancer Center

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mermaid2
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - User Guide:
    - Feature Generation: user-guide/features.md
    - Model Training: user-guide/training.md
    - Prediction: user-guide/prediction.md
    - QC Reports: user-guide/qc.md
    - Batch Processing: user-guide/batch.md
    - Nextflow Pipeline: user-guide/nextflow.md

  - Architecture: architecture.md
  - Changelog: changelog.md
  - Contributing: contributing.md
